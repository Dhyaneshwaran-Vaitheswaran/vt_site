<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Textile Red Gradient -->
    <linearGradient id="vtRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#C51E3A" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Luxury Gold Accent Gradient -->
    <linearGradient id="vtGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B48316" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#991B1B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background (Optional / Transparent by default, centered group) -->
  <g transform="translate(0, 0)">
    
    <!-- Outer Harmonious Weave Frame (Subtle Octagon / Shield Accent) -->
    <rect x="35" y="35" width="430" height="430" rx="36" fill="#0B1120" stroke="url(#vtGoldGrad)" stroke-width="3" stroke-opacity="0.35" />
    
    <!-- Inner Thread Grid Lines (Very subtle technical watermark) -->
    <line x1="80" y1="250" x2="420" y2="250" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="4 4" />
    <line x1="250" y1="80" x2="250" y2="420" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="4 4" />

    <!-- MONOGRAM VT EMBLEM -->
    <!-- 'V' - Bold Interwoven Left Wing -->
    <path d="M 115 130 
             L 175 130 
             L 250 345 
             L 220 345 
             Z" 
          fill="url(#vtRedGrad)" 
          filter="url(#softGlow)" />

    <!-- 'V' - Bold Interwoven Right Wing -->
    <path d="M 385 130 
             L 325 130 
             L 250 345 
             L 280 345 
             Z" 
          fill="url(#vtRedGrad)" 
          filter="url(#softGlow)" />

    <!-- 'T' - Horizontal Architectural Crossbar (Warp Beam) -->
    <rect x="150" y="155" width="200" height="34" rx="4" fill="url(#vtRedGrad)" />
    <!-- Gold Inlay Line on Crossbar -->
    <rect x="155" y="169" width="190" height="6" rx="3" fill="url(#vtGoldGrad)" />

    <!-- 'T' - Central Vertical Stem (Weft Pillar Interlacing through V) -->
    <path d="M 235 175 
             L 265 175 
             L 265 405 
             L 235 405 
             Z" 
          fill="url(#vtRedGrad)" />

    <!-- Gold Accent Warp Thread flowing along the T Pillar -->
    <line x1="250" y1="185" x2="250" y2="395" stroke="url(#vtGoldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Interlacing Loom Pin Details at Key Intersections -->
    <circle cx="250" cy="172" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="250" cy="345" r="4" fill="url(#vtGoldGrad)" />

    <!-- Small Trademark Registration Symbol (R) Motif -->
    <circle cx="410" cy="120" r="12" fill="none" stroke="url(#vtGoldGrad)" stroke-width="1.5" />
    <text x="410" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#D4AF37" text-anchor="middle">VT</text>

    <!-- Base Identity Wordmark -->
    <text x="250" y="440" font-family="'Playfair Display', serif" font-size="19" font-weight="700" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">
      VASANTHAA
    </text>
    <text x="250" y="458" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#D4AF37" letter-spacing="5" text-anchor="middle">
      TEXTILESS • ESTD 1998
    </text>
  </g>
</svg>
